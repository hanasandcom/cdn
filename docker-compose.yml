name: cdn

services:
  cdn:
    container_name: cdn
    image: cdn
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file:
      .env
    environment:
      API_URL: ${API_URL:-https://api.hanasand.com/api}
      DB_HOST: postgres
      INTERNAL_API: ${INTERNAL_API:-https://internal.hanasand.com/api}
      INTERNAL_WSS: ${INTERNAL_WSS:-wss://internal.hanasand.com/api/ws}
    volumes:
      - data:/var/lib/cdn/files
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8501:8080"

  postgres:
    container_name: cdn_database
    image: postgres:15
    command: ["postgres", "-c", "shared_preload_libraries="]
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cdn}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB:-cdn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "8502:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdn -d cdn"]
      interval: 5s
      retries: 5

  cdn_cron:
    container_name: cdn_cron
    image: alpine-base
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    build:
      context: ./cron
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DB_USER: cdn
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: cdn
      DB_HOST: postgres
    healthcheck:
      test: ["CMD", "pgrep", "-x", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
    name: cdn_data
  postgres_data:
